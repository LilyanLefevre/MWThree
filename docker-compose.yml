# The two maps shipped with the project are always served. To add more (and the base game's textures), point MW3_DIR at a folder:
#   MW3_DIR="/path/to/Call of Duty Modern Warfare 3" docker compose up -d --build
# It may hold zone/<map or language>/mp_*.ff, usermaps/<map>/ (community maps with their .iwd) and main/*.iwd; read-only.
# Without MW3_DIR the shared folder is an empty ./extra-maps. Then open http://<host>:4173
services:
  mwthree:
    build: .
    image: ghcr.io/lilyanlefevre/mwthree:latest
    ports:
      # loopback only by default (put a TLS reverse proxy / Cloudflare Tunnel in front); BIND=0.0.0.0 to open it on the network
      - "${BIND:-127.0.0.1}:${PORT:-4173}:4173"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    volumes:
      - "${MW3_DIR:-./extra-maps}:/data:ro"
    environment:
      MWTHREE_PASSWORD: "${MWTHREE_PASSWORD:-}"   # optional: protects the whole site (HTTP Basic, over TLS only)
    restart: unless-stopped

  # Optional Cloudflare Tunnel (profile "tunnel"): create the public hostname in the Cloudflare dashboard, service http://mwthree:4173
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARED_TOKEN:-}"   # required with COMPOSE_PROFILES=tunnel
    depends_on:
      - mwthree
