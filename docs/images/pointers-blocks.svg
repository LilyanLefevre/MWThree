<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="ui-monospace,Menlo,monospace" font-size="13">
  <rect width="900" height="400" fill="#fff"/>
  <text x="20" y="28" font-size="16" font-weight="bold">Chargement séquentiel : pointeurs et blocs mémoire</text>
  <text x="20" y="58" font-size="12" fill="#444">Flux (fichier)</text>
  <g stroke="#333" stroke-width="1.5">
    <rect x="20" y="66" width="130" height="40" fill="#ffd9ec"/><rect x="150" y="66" width="90" height="40" fill="#cfeccf"/>
    <rect x="240" y="66" width="110" height="40" fill="#cfeccf"/><rect x="350" y="66" width="130" height="40" fill="#ffd9ec"/>
    <rect x="480" y="66" width="100" height="40" fill="#cfeccf"/><rect x="580" y="66" width="130" height="40" fill="#ffe3b3"/>
    <rect x="710" y="66" width="170" height="40" fill="#fff" stroke-dasharray="4 3"/>
  </g>
  <g text-anchor="middle" font-size="12">
    <text x="85" y="91">struct Material</text><text x="195" y="91">nom "wc/…"</text><text x="295" y="91">textureTable[2]</text>
    <text x="415" y="91">struct Material</text><text x="530" y="91">nom "wc/…"</text><text x="645" y="91">ref → table</text><text x="795" y="91">…</text>
  </g>
  <text x="20" y="130" font-size="12">1. la struct est lue en entier (tailles issues du schéma)</text>
  <text x="20" y="148" font-size="12">2. pour chaque pointeur, dans l'ordre des membres : on lit les données qui suivent (valeur -1 / -2),</text>
  <text x="20" y="164" font-size="12">   ou on résout une référence vers une donnée déjà chargée (valeur « autre »)</text>
  <text x="20" y="190" font-size="14" font-weight="bold">Valeurs de pointeur</text>
  <g font-size="12">
    <text x="30" y="212">0x00000000   null</text>
    <text x="30" y="230">0xFFFFFFFF   FOLLOWING : les données suivent (allouées dans le bloc courant)</text>
    <text x="30" y="248">0xFFFFFFFE   INSERT    : idem + un slot de 4 octets dans VIRTUAL (cible des alias)</text>
    <text x="30" y="266">autre        ((bloc &lt;&lt; 28) | offset) + 1 → donnée déjà chargée (tableau, chaîne, asset)</text>
  </g>
  <text x="20" y="302" font-size="14" font-weight="bold">Blocs simulés (mp_dome, octets)</text>
  <g stroke="#333" stroke-width="1.2" font-size="11" text-anchor="middle">
    <rect x="20" y="314" width="560" height="26" fill="#cfd8ff"/><text x="300" y="331">VIRTUAL 38 451 167 — structs, tableaux, chaînes, slots</text>
    <rect x="585" y="314" width="200" height="26" fill="#ffe3b3"/><text x="685" y="331">VERTEX 19 968 448</text>
    <rect x="20" y="346" width="170" height="26" fill="#cfeccf"/><text x="105" y="363">INDEX 3 170 636</text>
    <rect x="195" y="346" width="190" height="26" fill="#f4c7c7"/><text x="290" y="363">RUNTIME 524 800</text>
    <rect x="390" y="346" width="120" height="26" fill="#e8e8e8"/><text x="450" y="363">SCRIPT 16 640</text>
  </g>
  <text x="525" y="363" font-size="11">TEMP : en-têtes, pile temporaire</text>
</svg>
