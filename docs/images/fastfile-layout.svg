<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="ui-monospace,Menlo,monospace" font-size="13">
  <rect width="900" height="330" fill="#fff"/>
  <text x="20" y="28" font-size="16" font-weight="bold">Fichier .ff signé (IWff0100) → zone décompressée</text>
  <g stroke="#333" stroke-width="1.5">
    <rect x="20" y="50" width="90" height="46" fill="#dbe7ff"/><rect x="110" y="50" width="60" height="46" fill="#dbe7ff"/>
    <rect x="170" y="50" width="70" height="46" fill="#e8e8e8"/><rect x="240" y="50" width="150" height="46" fill="#ffe3b3"/>
    <rect x="390" y="50" width="130" height="46" fill="#cfeccf"/><rect x="520" y="50" width="40" height="46" fill="#f4c7c7"/>
    <rect x="560" y="50" width="130" height="46" fill="#cfeccf"/><rect x="690" y="50" width="40" height="46" fill="#f4c7c7"/>
    <rect x="730" y="50" width="150" height="46" fill="#fff" stroke-dasharray="4 3"/>
  </g>
  <g text-anchor="middle">
    <text x="65" y="78">"IWff0100"</text><text x="140" y="78">version</text><text x="205" y="73">préfixe</text><text x="205" y="89" font-size="11">9 octets</text>
    <text x="315" y="73">"IWffs100" + auth</text><text x="315" y="89" font-size="11">0x4000 octets (ignoré)</text>
    <text x="455" y="73">256 chunks</text><text x="455" y="89" font-size="11">données (0x2000)</text>
    <text x="540" y="78" font-size="11">hash</text>
    <text x="625" y="73">256 chunks</text><text x="625" y="89" font-size="11">données</text>
    <text x="710" y="78" font-size="11">hash</text><text x="805" y="78">… (répété)</text>
  </g>
  <text x="20" y="125" font-size="12">octets 0–11 : en-tête · 12–20 : préfixe · 21 : signature · 16405 : début du flux compressé</text>
  <path d="M455 100 V150 M625 100 V150" stroke="#333" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#333"/></marker></defs>
  <rect x="300" y="152" width="330" height="40" fill="#cfeccf" stroke="#333" stroke-width="1.5"/>
  <text x="465" y="170" text-anchor="middle">concaténation des chunks de données</text>
  <text x="465" y="185" text-anchor="middle" font-size="11">(les chunks de hash sont jetés)</text>
  <path d="M465 192 V222" stroke="#333" marker-end="url(#a)"/>
  <text x="480" y="212" font-size="12">inflate (zlib)</text>
  <g stroke="#333" stroke-width="1.5">
    <rect x="20" y="226" width="110" height="46" fill="#ffd9ec"/><rect x="130" y="226" width="110" height="46" fill="#ffd9ec"/>
    <rect x="240" y="226" width="640" height="46" fill="#e6dcff"/>
  </g>
  <text x="75" y="246" text-anchor="middle">XFile</text><text x="75" y="262" text-anchor="middle" font-size="11">44 octets</text>
  <text x="185" y="246" text-anchor="middle">XAssetList</text><text x="185" y="262" text-anchor="middle" font-size="11">16 octets</text>
  <text x="560" y="246" text-anchor="middle">flux de données séquentiel (scriptstrings, table d'assets, assets…)</text>
  <text x="560" y="262" text-anchor="middle" font-size="11">mp_dome : 106 171 404 octets pour 60 383 253 compressés</text>
  <text x="20" y="305" font-size="12">XFile = size, externalSize, blockSize[9] · XAssetList = stringCount, strings*, assetCount, assets*</text>
</svg>
